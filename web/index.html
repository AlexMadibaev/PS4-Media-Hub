<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 Media Hub</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div class="brand">◈ <span>PS4 MEDIA HUB</span></div><div class="hint">DualShock: ← → ↑ ↓ · ✕ выбрать · ○ назад</div></header><section class="hero"><p class="eyebrow">HOME · PORTALS</p><h1>Ваши медиа.<br>Один экран.</h1><p>Добавляйте совместимые веб-порталы и запускайте их из единого интерфейса.</p></section><section class="toolbar"><h2>Мои порталы</h2><button id="add">＋ Добавить портал</button></section><div id="portals" class="grid"></div><section id="editor" class="panel hidden"><h2>Новый портал</h2><form id="form"><label>Название<input id="name" maxlength="60" required placeholder="Например, Мой портал"></label><label>Адрес HTTPS<input id="url" type="url" required placeholder="https://example.com"></label><div class="actions"><button type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form></section><footer id="status" aria-live="polite">Веб-прототип · совместимость с PS4 не проверена</footer></main><script src="./app.js"></script></body></html>
