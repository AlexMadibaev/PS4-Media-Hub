<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS4 Media Hub</title><link rel="stylesheet" href="./style.css"></head><body><main><header><div class="brand">◈ PS4 MEDIA HUB</div><div class="hint">← → навигация · ✕ выбор · ○ назад</div></header><section class="hero"><p class="eyebrow">HOME / PORTALS</p><h1>Ваши медиа.<br>Один экран.</h1><p>Порталы, избранное и управление с геймпада.</p></section><section class="toolbar"><h2>Мои порталы</h2><div class="actions"><button id="import">Импорт</button><button id="export">Экспорт</button><button id="add">＋ Добавить</button></div></section><div id="portals" class="grid"></div><section id="editor" class="panel hidden"><h2 id="formTitle">Добавить портал</h2><form id="form"><label>Название<input id="name" maxlength="60" required></label><label>HTTPS-адрес<input id="url" type="url" required placeholder="https://example.com"></label><div class="actions"><button type="submit">Сохранить</button><button type="button" id="cancel">Отмена</button></div></form></section><input type="file" id="importFile" accept="application/json,.json" hidden><footer id="status" aria-live="polite">Веб-прототип. Запуск на PS4 и совместимость порталов не проверены.</footer></main><script src="./app.js"></script></body></html>
