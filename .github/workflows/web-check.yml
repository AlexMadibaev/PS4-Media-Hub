name: Web prototype checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Verify prototype files
        run: test -s web/index.html && test -s web/style.css && test -s web/app.js
